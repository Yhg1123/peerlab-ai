name: Offline checks
on: [push, pull_request]
env:
  PYTHONUTF8: '1'
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m peerlab report examples/pilot/run.json --output runs/ci-report
      - run: python -m peerlab verify-dataset peerlab/data/review-study.json
      - run: python -m peerlab run --protocol independent --limit 3 --max-calls 42 --dry-run
      - run: python -m peerlab analyze examples/pilot/run.json --left baseline --right peer --output runs/ci-analysis
      - run: python -m peerlab analyze examples/review-study-v1/run.json --output runs/ci-study-analysis
      - run: python -m peerlab efficiency --dataset peerlab/data/token-efficiency-v1.json --limit 12 --max-calls 96 --seed 2026100203 --dry-run
      - run: python -m peerlab analyze-efficiency examples/token-efficiency-v1/run.json --output runs/ci-token-analysis
      - run: python -m peerlab efficiency --protocol token-efficiency-v2 --dataset peerlab/data/token-efficiency-v2.json --limit 24 --repeats 2 --seed 2026100301 --max-calls 288 --dry-run
      - run: python -m peerlab analyze-efficiency examples/token-efficiency-v2/run.json --output runs/ci-token-v2-analysis
      - run: python scripts/package_release.py
