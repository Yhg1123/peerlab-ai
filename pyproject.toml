[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "peerlab-ai"
version = "0.5.0"
description = "Reproducible DeepSeek × Kimi experiments on peer review, token efficiency, and output contracts."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
peerlab = "peerlab.__main__:main"

[tool.setuptools.package-data]
peerlab = ["data/*.json", "templates/*.html"]

[tool.setuptools.packages.find]
include = ["peerlab*"]
